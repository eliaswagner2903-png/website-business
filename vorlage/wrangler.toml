# Cloudflare Pages – Projektname je Kunde anpassen (klein, mit Bindestrichen).
name = "kundenseite"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[vars]
SEITE_URL = "https://www.beispiel.de"
# Preis-IDs aus dem Stripe-Dashboard (erst Testmodus!). Der Browser schickt nur den Namen.
PRODUKTE = '{"beratung":{"preis":"price_ERSETZEN","modus":"payment"}}'
KONTAKT_AN = "info@beispiel.de"
KONTAKT_VON = "website@beispiel.de"

# Geheimnisse NIE hier eintragen, sondern:
#   npx wrangler pages secret put STRIPE_SECRET_KEY
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler pages secret put RESEND_API_KEY
#   npx wrangler pages secret put TURNSTILE_SECRET   (optional)
