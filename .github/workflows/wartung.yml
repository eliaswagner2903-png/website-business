name: Wartung (wöchentlich)

on:
  schedule:
    - cron: "0 6 * * 1"   # montags 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Kundenseiten prüfen
        id: check
        run: node wartung/check.mjs | tee bericht.md
        continue-on-error: true
      - name: Bei Befunden ein Issue anlegen
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Wartung: Handlungsbedarf $(date +%F)"
          gh issue create --title "$titel" --body-file bericht.md --label wartung || gh issue create --title "$titel" --body-file bericht.md
