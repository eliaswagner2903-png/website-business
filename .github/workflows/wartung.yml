name: Wartung (wöchentlich)

on:
  schedule:
    - cron: "0 6 * * 1"   # montags 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Kundenseiten prüfen
        id: check
        run: node wartung/check.mjs | tee bericht.md
        continue-on-error: true
      - name: Bei Befunden ein Issue anlegen
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Wartung: Handlungsbedarf $(date +%F)"
          gh issue create --title "$titel" --body-file bericht.md --label wartung || gh issue create --title "$titel" --body-file bericht.md
