name: Deploy (manuell)

# Nur nötig, wenn ein Projekt NICHT per Git mit Cloudflare verbunden ist.
on:
  workflow_dispatch:
    inputs:
      kunde:
        description: "Ordnername unter kunden/ (slug)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slug prüfen
        env:
          KUNDE: ${{ inputs.kunde }}
        run: |
          [[ "$KUNDE" =~ ^[a-z0-9-]+$ ]] && [ -d "kunden/$KUNDE" ] || { echo "Unbekannter Kunde"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        working-directory: kunden/${{ inputs.kunde }}
        run: node --test tests/*.test.mjs
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kunden/${{ inputs.kunde }}
          command: pages deploy public --project-name=${{ inputs.kunde }}
