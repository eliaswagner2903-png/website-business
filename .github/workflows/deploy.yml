name: Deploy (manuell)

# Nur nötig, wenn ein Projekt NICHT per Git mit Cloudflare verbunden ist.
on:
  workflow_dispatch:
    inputs:
      kunde:
        description: "Ordnername unter kunden/ (slug)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Slug prüfen
        env:
          KUNDE: ${{ inputs.kunde }}
        run: |
          [[ "$KUNDE" =~ ^[a-z0-9-]+$ ]] && [ -d "kunden/$KUNDE" ] || { echo "Unbekannter Kunde"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        working-directory: kunden/${{ inputs.kunde }}
        run: node --test tests/*.test.mjs
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kunden/${{ inputs.kunde }}
          command: pages deploy public --project-name=${{ inputs.kunde }}
