name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seiten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Werkzeuge installieren
        run: cd werkzeuge && npm install --no-audit --no-fund
      - name: Vorlage und alle Kundenseiten prüfen
        run: |
          set -e
          for s in vorlage kunden/*/; do
            [ -f "$s/package.json" ] || continue
            echo "::group::$s"
            (cd "$s" && node --test tests/*.test.mjs)
            werkzeuge/node_modules/.bin/html-validate -c werkzeuge/.htmlvalidate.json "$s"/public/*.htm*
            python3 werkzeuge/kopf-pruefen.py "$s/public"
            echo "::endgroup::"
          done
      - name: Auftragslog lesbar
        run: python3 ops/log.py liste --n 3
      - name: Wartungsprüfung ist ausführbar
        run: node --check wartung/check.mjs
