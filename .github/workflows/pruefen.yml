name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seiten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Werkzeuge installieren
        run: cd werkzeuge && npm install --no-audit --no-fund
      - name: Vorlage und alle Kundenseiten prüfen
        run: |
          set -e
          for s in vorlage kunden/*/; do
            [ -f "$s/package.json" ] || continue
            echo "::group::$s"
            (cd "$s" && node --test tests/*.test.mjs)
            werkzeuge/node_modules/.bin/html-validate -c werkzeuge/.htmlvalidate.json "$s"/public/*.htm*
            python3 werkzeuge/kopf-pruefen.py "$s/public"
            echo "::endgroup::"
          done
      - name: Auftragslog lesbar
        run: python3 ops/log_vereinen.py --pruefen && python3 ops/log.py liste --n 3
      - name: Wartungsprüfung ist ausführbar
        run: node --check wartung/check.mjs
